<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFF1F6"><title>一丹的衣橱</title>
<script>try{var t=localStorage.getItem("yidanWardrobeTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}(function(){var v="events";try{if(localStorage.getItem("yidanWardrobeView")==="wardrobe")v="wardrobe"}catch(e){}document.documentElement.setAttribute("data-view",v)})()</script>
<style>
:root{--bow:#F9A8C6;--bg:#FFF1F6;--dot:#F7D2E1;--line:#F6C4D8;--deep:#D6457F;--soft:#FFDCEA;--ink:#4A1730;--muted:#8E6B7E;--chip:#FFF0F6}
[data-theme=lavender]{--bow:#CDB8F3;--bg:#F7F3FF;--dot:#E2D7F8;--line:#D9CBF3;--deep:#8A5BCB;--soft:#E8DDFB;--ink:#33204F;--muted:#7C6D95;--chip:#F3EDFF}
[data-theme=mint]{--bow:#9ADFC0;--bg:#EFFAF4;--dot:#C8EBD8;--line:#BCE4CE;--deep:#2A9A70;--soft:#D6F2E4;--ink:#1F3D31;--muted:#5F8174;--chip:#E9F8F0}
[data-theme=sky]{--bow:#9CCBF4;--bg:#EEF7FF;--dot:#C7E1F8;--line:#BBD9F3;--deep:#3B87D4;--soft:#D4E9FB;--ink:#1D3350;--muted:#62799A;--chip:#E8F3FD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:22px 22px;transition:background-color .3s;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 44px}
/* header */
.top{position:relative;background:#fff;border:2px solid var(--line);border-radius:26px;padding:16px 104px 14px 18px;margin-bottom:14px;min-height:104px}
.top h1{margin:0 0 3px;font-size:24px;line-height:32px;font-weight:900;letter-spacing:.5px}
.top .sub{margin:0;font-size:14px;line-height:21px;color:var(--muted);font-weight:500}
.peek{position:absolute;right:2px;top:50%;transform:translateY(-50%) scaleX(-1);width:82px;height:auto;pointer-events:none}
.dots{display:flex;align-items:center;gap:8px;margin-top:10px}
.dots button{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.dots button.on{box-shadow:0 0 0 2.5px var(--deep)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 10px;font-size:15px;font-weight:800;cursor:pointer;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--muted);transition:transform .15s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 8px 18px -8px var(--deep)}
.cnt{display:inline-block;min-width:28px;text-align:center;font-size:13px;line-height:22px;font-weight:800;padding:0 9px;border-radius:999px;background:var(--soft);color:var(--deep)}
.btn.on .cnt{background:rgba(255,255,255,.28);color:#fff}
.evv,.wdv{display:none}[data-view=events] .evv{display:block}[data-view=wardrobe] .wdv{display:block}
.panel{background:#fff;border:2px solid var(--line);border-radius:26px;padding:16px 16px 14px;margin-bottom:14px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph h2{margin:0;font-size:19px;line-height:28px;font-weight:900}
.badge{font-size:13px;font-weight:800;color:var(--deep);background:var(--soft);padding:3px 12px;border-radius:999px;white-space:nowrap}
.reset{margin-left:auto;background:none;border:0;color:var(--deep);font-size:15px;font-weight:700;cursor:pointer;padding:8px 4px}
.fl{font-size:13px;font-weight:800;color:var(--muted);margin:0 2px 8px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 8px 0 15px;font-size:15px;font-weight:700;cursor:pointer;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);transition:transform .15s}
.pill:active{transform:scale(.96)}
.pill .cnt{font-size:12px;line-height:20px;min-width:26px;padding:0 8px;background:var(--chip);color:var(--muted)}
.pill.on{background:var(--soft);border-color:var(--deep);color:var(--deep)}
.pill.on .cnt{background:#fff;color:var(--deep)}
.fbar{margin:0 0 12px}
.fbar .pills{margin-bottom:0;flex-wrap:wrap;max-width:100%}
.fbar .pill{min-height:38px;font-size:14px;padding:0 6px 0 13px;gap:6px}

.top,.wnote,.panel,.gh,.opt{position:relative}
.dc{position:absolute;display:block;pointer-events:none;line-height:0;z-index:2}.dc svg{display:block;width:100%;height:auto;overflow:visible}
.bw-tc{top:-14px;left:50%;width:42px;margin-left:-21px}.bw-tl{top:-13px;left:14px;width:40px;transform:rotate(-14deg)}.bw-tr{top:-13px;right:16px;width:40px;transform:rotate(14deg)}
.ht{width:12px}.ht2{width:9px}
.hp1{top:-6px;right:34px;transform:rotate(14deg)}.hp2{bottom:-6px;left:26px;transform:rotate(-12deg)}.hp3{bottom:-5px;right:18px;transform:rotate(10deg)}.hp4{top:-5px;left:30px;transform:rotate(-10deg)}.hp5{top:40%;right:-6px;transform:rotate(18deg)}.hp6{top:55%;left:-6px;transform:rotate(-16deg)}
.dv{display:block;margin:24px auto 0;width:min(78%,300px);height:auto}
.gh{display:block;background:#fff;border:2px solid var(--line);border-radius:26px;padding:16px 14px 14px;margin:30px 0 14px}
.gh .gtop{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.gh .gtop img{grid-row:1/3;width:62px;height:auto}.gh .gtop img.fl2{transform:scaleX(-1)}
.sess{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc2{font-size:12px;line-height:18px;font-weight:600;color:var(--ink);background:var(--chip);border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}
.sc2 b{font-weight:800;color:var(--deep);margin-right:3px}
.sc2.e{border-style:dashed;color:var(--deep);font-weight:800}
.gnote{margin-top:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:26px;padding:20px 14px 16px;margin:0 0 18px}
.opt .evt .dt{padding:0 12px}
.opt h3{margin:8px 0 3px;font-size:17px;line-height:24px;font-weight:900;word-break:break-word}
.opt .fit{font-size:13px;line-height:19px;color:var(--muted);font-weight:600}.opt .fit b{color:var(--deep);font-weight:800}
.board.nm0{grid-template-columns:1fr}
@media(min-width:560px){.opt{padding:24px 20px 20px}}

/* tinder stack */
html,body{overflow-x:hidden}
.stkw{margin:0 0 6px}
.stk{position:relative;overflow:hidden;padding:24px 0 6px;margin:0 -14px;-webkit-user-select:none;user-select:none}
.deck{--ch:560px;position:relative;width:min(100%,440px);height:calc(var(--ch) + 34px);margin:0 auto}
.sc{position:absolute;left:4%;top:0;width:92%;height:var(--ch);background:#fff;border:2px solid var(--line);border-radius:26px;padding:18px 12px 10px;display:flex;flex-direction:column;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;will-change:transform;cursor:grab;box-shadow:0 12px 26px -16px rgba(190,60,115,.45);transform-origin:50% 100%;transition:transform .34s cubic-bezier(.22,.9,.3,1.05),opacity .25s;backface-visibility:hidden}
.sc.drag{transition:none;cursor:grabbing}
.sc.fly{transition:transform .42s cubic-bezier(.3,.1,.6,.9),opacity .42s}
.sc img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.sct{display:flex;align-items:center;gap:8px;min-width:0}
.sct .dt{flex:none;font-size:12px;line-height:22px;font-weight:900;color:#fff;background:var(--deep);border-radius:999px;padding:0 11px}
.sct .swx{min-width:0;font-size:12px;line-height:20px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:999px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc h3{margin:8px 0 0;font-size:16px;line-height:22px;font-weight:900;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.smd{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:8px 0}
.smd img{height:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px;border:2px solid var(--line);background:var(--chip)}
.sc .cflat{margin:0;background:var(--chip);border-radius:16px;padding:8px}
.sc .cflat .og{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px}
.sc .oi .nm{font-size:10.5px;line-height:13px;-webkit-line-clamp:2}.sc .oi .sl{font-size:10.5px;line-height:14px}.sc .oi .co{display:none}
.sc .oi .img{border-radius:10px}.sc .oi.ms .img{font-size:14px}
.sc.nomd .cflat{flex:1;margin:10px 0 0;display:flex;align-items:center}.sc.nomd .cflat .og{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.sc.nomd .oi .nm{font-size:12px;line-height:15px}.sc.nomd .oi .sl{font-size:12px}

.sc .cflat{margin:10px 0 0;padding:10px;flex:none}
.sc .cflat.c2 .img{aspect-ratio:10/9}
.sc .cflat.c4 .og{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}.sc .cflat.c4 .oi .nm{font-size:10.5px;line-height:13px}.sc .cflat.c4 .oi .sl{font-size:10.5px}.sc .cflat.c4 .oi .co{font-size:10px}
.sc .cflat .og{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.sc .cflat.c2 .og{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.sc .oi .img{aspect-ratio:4/5;border-radius:14px}
.sc .oi .nm{font-size:12.5px;line-height:16px;-webkit-line-clamp:2}.sc .oi .sl{font-size:12px;line-height:16px}.sc .oi .co{display:block;font-size:11px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .cflat:not(.c2):not(.c4) .oi .nm{font-size:11.5px;line-height:14px}
.sc .oi.ms .img{font-size:22px}

.sct .gtg{flex:none;font-size:12px;line-height:22px;font-weight:900;color:var(--deep);background:var(--soft);border-radius:999px;padding:0 11px}
.sct .dt{margin-left:auto}
.evb{margin-top:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:16px;padding:8px 11px;display:flex;flex-direction:column;gap:5px}
.evb .evl{font-size:12.5px;line-height:17px;font-weight:600;color:var(--ink);min-width:0}
.evb .evl b{display:block;color:var(--deep);font-weight:900;font-size:13px}
.evb .evl span{font-weight:800}.evb .evl em{font-style:normal;color:var(--muted);font-weight:600}.evb .evl em:before{content:" · "}
.evb.none{border-style:dashed}.evb.none .evl{color:var(--deep);font-weight:800;font-size:13px}
.sc .swx{margin-top:8px;align-self:flex-start;max-width:100%;font-size:12px;line-height:20px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:999px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc h3{margin:10px 0 0;font-size:15px;line-height:21px;padding-top:9px;border-top:1.5px dashed var(--line)}
.sc .pal{margin:3px 0 0;font-size:12.5px;line-height:18px;font-weight:800;color:var(--deep)}
.wbtn{margin:8px auto 0;border:0;background:none;color:var(--deep);font-size:13px;font-weight:800;cursor:pointer;padding:4px 10px;flex:none}
.cwhy{position:absolute;inset:0;background:rgba(255,255,255,.97);border-radius:24px;padding:22px 16px 14px;display:none;flex-direction:column;gap:8px;z-index:6;overflow:hidden}
.sc.why .cwhy{display:flex}
.cwhy .fit,.cwhy .wsl{font-size:13px;line-height:19px;font-weight:600;color:var(--muted)}.cwhy .fit b{color:var(--deep)}
.cwhy p{margin:0;font-size:14px;line-height:21px;font-weight:500}
.cwhy .nt{margin:0}
.cwhy .wbtn{margin-top:auto}
.sc>.wbtn{margin-top:auto;padding-top:10px}
.stamp{position:absolute;top:50px;z-index:5;opacity:0;pointer-events:none;font-size:20px;line-height:1;font-weight:900;letter-spacing:1px;padding:8px 14px;border-radius:16px;border:3px solid;background:rgba(255,255,255,.88);display:flex;align-items:center;gap:5px}
.stamp svg{width:20px;height:18px}
.stamp.like{left:14px;color:var(--deep);border-color:var(--deep);transform:rotate(-14deg)}
.stamp.nope{right:14px;color:#9C6B87;border-color:#E8B5CE;transform:rotate(14deg)}
.sc.endc{display:none;align-items:center;justify-content:center;text-align:center;gap:10px;touch-action:auto;cursor:default;transition:opacity .35s;opacity:0;z-index:1}
.sc.endc.show{display:flex;opacity:1}
.sc.endc img{width:150px;height:auto}
.sc.endc h3{display:block;font-size:22px;line-height:30px;margin:0}
.sc.endc p{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.again{border:0;background:var(--deep);color:#fff;font-size:16px;font-weight:800;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 8px 18px -8px var(--deep)}
.sctl{display:flex;align-items:center;justify-content:center;gap:26px;margin:6px 0 4px}
.rb{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 8px 16px -8px rgba(190,60,115,.45);transition:transform .15s}
.rb:active{transform:scale(.92)}.rb svg{width:26px;height:26px}
.rb.lk{background:var(--deep);border-color:var(--deep);color:#fff}
.rb:disabled{opacity:.4;cursor:default}
.scn{min-width:64px;text-align:center;font-size:15px;font-weight:800;color:var(--ink)}
.lkrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1.5px dashed var(--line)}
.lkrow:first-of-type{border-top:0}
.lkrow img{width:56px;height:74px;object-fit:cover;border-radius:12px;border:1.5px solid var(--line);background:var(--chip)}
.lkrow b{display:block;font-size:14px;line-height:19px;font-weight:800}.lkrow span{font-size:12px;color:var(--muted);font-weight:600}
.lkrow button{border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;font-size:12px;font-weight:800;padding:6px 12px;cursor:pointer}
@media(min-width:560px){.sc{padding:20px 16px 12px}.sc .oi .nm{font-size:11.5px;line-height:14px}}
/* weather note */
.wnote{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:24px;padding:12px 14px 10px 10px;margin-bottom:6px}
.wnote img{flex:none;width:64px;height:auto}
.wl{font-size:15px;font-weight:800;margin:2px 0 4px}
.wsum{font-size:13px;line-height:20px;font-weight:500}
.wdt summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--deep);padding:6px 0 2px;list-style:none}.wdt summary::-webkit-details-marker{display:none}.wdt summary:after{content:" \25BE"}.wdt[open] summary:after{content:" \25B4"}
.wchips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 6px}
.wc{background:var(--chip);border-radius:14px;padding:6px 10px;min-width:0}
.wc b{display:block;font-size:12px;line-height:17px;font-weight:800}
.wc span{display:block;font-size:11.5px;line-height:16px;color:var(--muted);font-weight:600}
.wsrc{font-size:11.5px;line-height:17px;color:var(--muted);font-weight:500}
/* groups */
.gh .gt{display:flex;align-items:center;gap:10px}
.gh h2{margin:0;font-size:21px;line-height:28px;font-weight:900}
.gh p{margin:2px 0 0;font-size:13px;line-height:19px;color:var(--muted);font-weight:600}
.gsep{display:block;margin:20px auto 0;width:min(70%,300px);height:auto;opacity:.95}
/* event card */
.tag{align-self:flex-start;font-size:12px;line-height:20px;font-weight:800;padding:0 10px;border-radius:999px}
.ev{background:#fff;border:2px solid var(--line);border-radius:26px;padding:14px 14px 15px;margin:0 0 14px}
.evt{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.evt .dt{font-size:13px;line-height:22px;font-weight:900;color:#fff;background:var(--deep);border-radius:999px;padding:0 11px}
.evt .tm{font-size:14px;line-height:20px;font-weight:800;color:var(--deep)}
.ev h3{margin:8px 0 2px;font-size:17px;line-height:24px;font-weight:900;word-break:break-word}
.ev .pl{font-size:13px;line-height:19px;color:var(--muted);font-weight:600}
.wx{margin:10px 0 12px;background:var(--chip);border-radius:14px;padding:7px 12px;font-size:13px;line-height:19px;font-weight:600}
.board{display:grid;gap:12px}
.mdl{justify-self:center;width:min(62%,230px)}
.mdl img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:22px;border:2px solid var(--line);background:var(--chip)}
.flat{background:var(--chip);border-radius:20px;padding:10px}
.og{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.oi{min-width:0;display:flex;flex-direction:column;gap:3px;color:var(--ink);text-decoration:none}
a.oi:hover .img{border-color:var(--deep)}
.img{width:100%;aspect-ratio:1/1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.oi .img{border-radius:14px;border:1.5px solid var(--line);font-size:11px;color:var(--muted);font-weight:700}
.oi .sl{font-size:11px;line-height:15px;font-weight:800;color:var(--deep)}
.oi .nm{font-size:11.5px;line-height:15px;font-weight:700;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.oi .co{font-size:11px;line-height:15px;color:var(--muted);font-weight:600}
.oi .co em{font-style:normal;color:#9A6400}
.oi.ms .img{border:2px dashed var(--deep);background:var(--chip);color:var(--deep);font-size:18px;font-weight:900}
.oi.ms .nm{color:var(--deep)}
.why{margin-top:12px;font-size:14px;line-height:21px;font-weight:500}
.why b{color:var(--deep);font-weight:800;margin-right:4px}
.nt{margin-top:10px;font-size:13px;line-height:19px;font-weight:700;color:#9A6400;background:#FFF6DC;border-radius:12px;padding:6px 12px}
.plh{font-size:14px;font-weight:800;margin:14px 2px 8px}
.sws{display:flex;flex-direction:column;gap:10px}
.sw{border:2px solid var(--line);border-radius:20px;padding:11px 12px 12px;background:#fff}
.sw .st{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.sw .st b{font-size:15px;line-height:21px;font-weight:900}
.sw .st span{font-size:13px;font-weight:800;color:var(--deep)}
.sw .sp{font-size:12px;line-height:18px;color:var(--muted);font-weight:600}
.sw .sc{margin:6px 0 8px;font-size:13px;line-height:19px;font-weight:500}
.sw .wx{margin:6px 0 8px;padding:5px 10px;font-size:12px;line-height:17px}
.sbd{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start}
.sbd.nm0{grid-template-columns:1fr}
.sbd .mdl{width:100%}.sbd .mdl img{border-radius:16px}
.sbd .og{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw .flat{padding:8px}
.mlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.mlist li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:21px;font-weight:500}
.mlist li:before{content:"缺";flex:none;width:28px;height:28px;margin-top:-2px;border:2px dashed var(--deep);border-radius:9px;color:var(--deep);font-size:13px;line-height:24px;text-align:center;font-weight:900}
.mlist b{font-weight:800}
.mbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.mbox img{width:84px;height:auto;margin-top:4px}
.sd{margin-top:14px;font-size:12px;line-height:18px;color:var(--muted);font-weight:500;padding:0 4px}
/* wardrobe */
.wh{display:flex;align-items:center;gap:12px;margin-bottom:12px}

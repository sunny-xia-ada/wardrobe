</style></head><body><div class="wrap">

</div><script>

CATS.filter(function(c){return cc[c.k];}).forEach(function(c){kr.appendChild(pill(cat===c.k,c.label,cc[c.k],function(){cat=c.k;renderWardrobe();}));});
var s=q.trim().toLowerCase();var shown=ITEMS.filter(function(x){return inClass(x.t,cls)&&(cat==="all"||x.k===cat)&&(s===""||(x.n+" "+x.c+" "+x.s).toLowerCase().indexOf(s)>=0);});
document.getElementById("shown").textContent="显示 "+shown.length+" 件";var gr=document.getElementById("grid");gr.innerHTML="";
if(shown.length){gr.className="grid";shown.forEach(function(it){gr.appendChild(card(it));});}else{gr.className="empty";gr.appendChild(im(ILL.bunny_sleep,"","睡着的小兔"));gr.appendChild(document.createTextNode("没找到这件，换个关键词试试吧"));}}

var d=document.createElement("div");d.className="dv";d.setAttribute("aria-hidden","true");d.innerHTML='<svg viewBox="0 0 260 28" width="100%">'+L+R+'<g transform="translate(112 -1) scale(.66)">'+BOW.replace(/<\/?svg[^>]*>/g,"")+'</g></svg>';return d;}

if(it.u){box=el("a","oi");box.href=it.u;box.target="_blank";box.rel="noopener noreferrer";}else box=el("div","oi");

return adorn(c,["bw-tc",o.n%2?"hp2":"hp3",o.n%2?"hp1":"hp4"]);}
var ARW='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg>';
function carousel(g){var car=el("div","car");var tr=el("div","track");tr.setAttribute("role","list");tr.setAttribute("aria-label",g.label+"搭配，左右滑动");
g.opts.forEach(function(o){tr.appendChild(optCard(o,g.opts.length));});car.appendChild(tr);
var pv=el("button","cbtn prev");pv.type="button";pv.setAttribute("aria-label","上一套");pv.innerHTML=ARW;
var nx=el("button","cbtn next");nx.type="button";nx.setAttribute("aria-label","下一套");nx.innerHTML=ARW;nx.firstChild.style.transform="scaleX(-1)";
car.appendChild(pv);car.appendChild(nx);
var dots=el("div","cdots");var cur=0,raf=0;
var ds=g.opts.map(function(o,i){var b=el("button","cdot"+(i===0?" on":""));b.type="button";b.setAttribute("aria-label","第 "+(i+1)+" 套");b.onclick=function(){go(i);};dots.appendChild(b);return b;});
function cards(){return tr.querySelectorAll(".opt");}
function go(i){var cs=cards();var c=cs[Math.max(0,Math.min(cs.length-1,i))];if(!c)return;tr.scrollTo({left:c.offsetLeft-(tr.clientWidth-c.offsetWidth)/2,behavior:"smooth"});}
function upd(){var cs=cards(),mid=tr.scrollLeft+tr.clientWidth/2,best=0,bd=1e9;for(var i=0;i<cs.length;i++){var d=Math.abs(cs[i].offsetLeft+cs[i].offsetWidth/2-mid);if(d<bd){bd=d;best=i;}}
cur=best;ds.forEach(function(b,i){b.className="cdot"+(i===best?" on":"");});pv.disabled=best===0;nx.disabled=best===cs.length-1;}
pv.onclick=function(){go(cur-1);};nx.onclick=function(){go(cur+1);};
tr.addEventListener("scroll",function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;upd();});},{passive:true});
window.addEventListener("resize",upd);setTimeout(upd,0);
var wrap=document.createElement("div");wrap.appendChild(car);wrap.appendChild(dots);return wrap;}

TYPES.forEach(function(g){pr.appendChild(pill(evf===g.k,g.label,g.opts.length,function(){evf=g.k;renderEvents();window.scrollTo(0,document.getElementById("tabs").offsetTop);}));});fb.appendChild(pr);root.appendChild(fb);
var wn=el("div","wnote");wn.appendChild(im(ILL.bunny_umbrella,"","打伞的小兔"));var wt=el("div");wt.appendChild(el("div","wl","天气 · 西雅图 / Bellevue"));
wt.appendChild(el("div","wsum","11/3–11/12 约 4–15°C。11/4–11/8 连续小雨（11/8 最湿，约 6 mm），11/9 起转多云，11/10–11/12 基本不下雨，11/15 演唱会当天有雨。"));
var dt=document.createElement("details");dt.className="wdt";var sm=document.createElement("summary");sm.textContent="逐日天气";dt.appendChild(sm);var wc=el("div","wchips");
WSUM.forEach(function(d){var c=el("div","wc");c.appendChild(el("b",null,d.d+" "+d.w));c.appendChild(el("span",null,d.lo+"–"+d.hi+"°C · "+d.t));wc.appendChild(c);});
var c2=el("div","wc");c2.appendChild(el("b",null,"11/18 以后"));c2.appendChild(el("span",null,"典型 5–11°C · 常有小雨"));wc.appendChild(c2);dt.appendChild(wc);
dt.appendChild(el("div","wsrc","11/17 前为预报（Open-Meteo 温度 + NWS 降雨概率），11/18 以后超出预报，按典型 11 月中旬天气估计。"));wt.appendChild(dt);wn.appendChild(wt);root.appendChild(adorn(wn,["bw-tr","hp2"]));
var first=true;TYPES.forEach(function(g){if(evf!=="all"&&evf!==g.k)return;

var gh=el("div","gh");gh.id="g-"+g.k;var gt=el("div","gtop");gt.appendChild(im(ILL[g.ill],g.flip?"fl2":"",""));var tt=el("div","gt");tt.appendChild(el("h2",null,g.label));tt.appendChild(el("span","badge",g.opts.length+" 套"));gt.appendChild(tt);gt.appendChild(el("p",null,g.desc));gh.appendChild(gt);
var se=el("div","sess");if(g.sessions.length)g.sessions.forEach(function(s){se.appendChild(sessChip(s));});else se.appendChild(el("span","sc2 e",g.empty));gh.appendChild(se);
if(g.note)gh.appendChild(el("div","nt gnote",g.note));
root.appendChild(adorn(gh,["bw-tl","hp1","hp3"]));
root.appendChild(carousel(g));});
root.appendChild(divider());
var mp=el("div","panel");mp.style.marginTop="18px";var mh=el("div","ph");mh.appendChild(el("h2",null,"缺的单品"));mp.appendChild(mh);var mb=el("div","mbox");mb.appendChild(im(ILL.bunny_sleep,"","睡着的小兔"));var ul=el("ul","mlist");
MISSING.forEach(function(m){var li=el("li");var d=el("div");d.appendChild(el("b",null,m[0]));d.appendChild(document.createTextNode("："+m[1]));li.appendChild(d);ul.appendChild(li);});
mb.appendChild(ul);mp.appendChild(mb);root.appendChild(adorn(mp,["hp2","hp3","hp1"]));
root.appendChild(el("div","sd","只用衣橱里已有的单品搭配（已排除退货、取消和美妆）。名称旁标“未见发货邮件”的单品，订单状态是已下单但没找到发货邮件，请确认已到货。模特是根据每套单品画的插画，颜色和版型尽量贴近，细节以右边的单品图为准。点有链接的单品可打开 Musinsa 商品页。"));}
